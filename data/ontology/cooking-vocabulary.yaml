# ============================================================================
# TECHNIQUES D'ACCOMMODATION — comment un plat sert un convive incompatible
# ============================================================================
# Le corpus annoté du 2026-09-02 (docs/conception/CORPUS_ACCOMMODATIONS.md) a
# remplacé l'unique observation `mafe-poulet` par 8 observations ancrées sur les
# 28 recettes de famille « servie à une tablée ». Chaque statut ci-dessous porte
# son compte. La mesure a produit deux surprises :
#   - `self_service` n'existait pas et c'est la technique LA PLUS pratiquée ;
#   - `separate_dish` existait et n'a AUCUNE observation.
#
# ⚠️ Le marqueur de détection n'est pas « à part » — quatre recettes disent
# « à part » pour parler de cuisson ou de dressage. C'est la présence d'un NOM
# DE CONVIVE ou d'un marqueur collectif (« libre-service », « chacun ») dans la
# même phrase qui fait l'accommodation.
accommodations:
  - key: self_service
    label: "Libre-service"
    status: active
    definition: "L'ingrédient litigieux est servi à part, chacun se sert ; le convive arbitre, pas la recette."
    applicable_when: "L'ingrédient est ajoutable après coup sans recuisson — crudité, condiment, garniture."
    observed_in: ["salade-vietnamienne", "sandwiches-rillettes-thon", "sandwiches-saumon-fume-saint-moret", "tortilla-pizza-atelier"]
  - key: full_substitution
    label: "Substitution totale"
    status: active
    definition: "L'ingrédient est remplacé pour tout le monde ; le plat change."
    applicable_when: "L'ingrédient est fondu dans la préparation — haché, mariné, mijoté dans la base, réduit en sauce."
    observed_in: ["mafe-poisson-legumes", "salade-lentilles-froides-graines-courge", "tagliatelles-carbonara-vege"]
  # ⚠️ Deux des trois observations de `full_substitution` sont matérialisées par
  # une FICHE JUMELLE (mafe-poulet / mafe-poisson-legumes : étapes 1-5 identiques,
  # protéine remplacée), pas par une règle appliquée à la volée. Une réparation
  # devrait chercher la fiche jumelle avant de recomposer une substitution.
  - key: separate_portion
    label: "Part séparée"
    status: probation
    definition: "Le plat est cuisiné tel quel ; une part reçoit un ingrédient différent au service."
    applicable_when: "L'ingrédient est ajouté tard — posé sur le plat, saisi à part, incorporé au service."
    observed_in: ["mafe-poulet"]
  # Reste en probation : UNE observation. Le corpus l'a confirmée sans l'élargir.
  - key: separate_dish
    label: "Plat séparé"
    status: probation
    definition: "Un plat distinct est préparé pour le convive incompatible."
    applicable_when: "Ni la substitution ni la part séparée ne tiennent — le plat est indissociable de son ingrédient."
    observed_in: []
  # ZÉRO observation sur 28 recettes. Conservée — l'absence dans ce corpus n'est
  # pas une preuve d'impossibilité — mais elle ne pèse pas comme les autres.
  #
  # ⚠️ Décision du 2026-09-03 : « ne pèse pas comme les autres » était jusqu'ici
  # une note humaine que rien n'exécutait. `accommodations_by_evidence()` classe
  # désormais par statut PUIS par nombre d'observations, et un test refuse
  # qu'une accommodation en probation précède une active. `observed_in` est
  # propagé jusqu'à l'artefact JSON depuis la v0.3.0 : avant, il s'arrêtait au
  # YAML, et tout tri par observations aurait compté zéro partout sans erreur.

# ============================================================================
# RETOURS DE TABLE (v0.4.0) — trois axes, trois questions distinctes
# ============================================================================
# Se tromper d'axe produit une donnée qui ne veut rien dire :
#   appreciations   → À QUEL POINT CETTE PERSONNE a aimé (une ligne par convive)
#   replay_verdicts → QUE FAIT-ON DU PLAT ensuite (une ligne par plat)
#   issue_kinds     → QUELLE EST LA NATURE DU DÉFAUT (facultatif, explique un verdict)
#
# Un plat adoré de tous peut être `retire` (trop long un soir de semaine) ; un
# plat moyen peut être `keep_as_is` (dépannage rapide assumé). Les deux axes ne
# se déduisent pas l'un de l'autre — c'est pourquoi ils sont séparés.
#
# TOUT EN PROBATION : mesuré sur 4 retours réels seulement (recipe_execution au
# 2026-09-07), tous à 5/5, tous « adoré par tous ». Quatre retours unanimes ne
# distinguent rien : aucune de ces valeurs n'a encore trié quoi que ce soit.

_scope:
  applies_to: "Un plat cuisiné à la maison et servi à une tablée identifiée."
  does_not_apply_to:
    - "repas hors domicile (ex. « Restaurant Marseille » au menu 2026-09-01) — personne n'a cuisiné, il n'y a rien à rejouer"
    - "restes (`<slot>_leftovers: true`) — le jugement porte sur le plat d'origine, le noter deux fois le compterait deux fois"
    - "remplissages macro sans préparation (« Fromage blanc + whey », « Compote + graines de courge ») — la question « c'était bon ? » n'y a pas de sens décisionnel"
  absence_means: "PAS INSTRUIT ou HORS PÉRIMÈTRE — jamais « personne n'a aimé ». Ne pas combler par défaut."
  known_tensions:
    - "`mixed` recouvre deux natures : « bon mais pas terrible » et « une partie du plat oui, une autre non ». Scinder si la distinction devient décisive."
    - "`effort` est un défaut ressenti par le cuisinier, pas par la tablée — seul axe où l'avis de celui qui cuisine prime."

appreciations:
  - key: loved
    label: "Adoré"
    status: probation
    definition: "En redemande, à remettre au menu sans hésiter."
    synonyms: ["adoré", "excellent", "top", "délicieux", "en redemande"]
  - key: liked
    label: "Aimé"
    status: probation
    definition: "Mangé avec plaisir, sans enthousiasme particulier."
    synonyms: ["aimé", "bien", "bon", "correct", "sympa"]
  - key: mixed
    label: "Mitigé"
    status: probation
    definition: "Mangé sans plaisir, ou apprécié seulement en partie."
    synonyms: ["moyen", "mitigé", "bof", "sans plus", "moyennement", "moins aimé", "moins bien", "moins bon"]
  - key: disliked
    label: "Pas aimé"
    status: probation
    definition: "Mangé à contrecœur, ou laissé en partie."
    synonyms: ["pas aimé", "pas terrible", "mauvais", "pas fini"]
  - key: refused
    label: "Refusé"
    status: probation
    definition: "N'a pas été mangé du tout."
    applicable_when: "Distinguer d'un interdit alimentaire : un refus se constate à table, une contrainte se déclare dans `person`."
    synonyms: ["refusé", "pas touché", "n'a pas mangé"]

replay_verdicts:
  - key: keep_as_is
    label: "À refaire tel quel"
    status: probation
    definition: "Le plat rentre dans la rotation sans modification."
    synonyms: ["à refaire", "à garder", "tel quel", "on garde"]
  - key: adjust
    label: "À refaire en modifiant"
    status: probation
    definition: "Le plat vaut la peine, mais une correction est nécessaire — laquelle vit dans issue_kinds."
    applicable_when: "Toujours accompagné d'au moins un issue_kinds, sinon la correction est perdue."
    synonyms: ["à ajuster", "à modifier", "à revoir", "presque", "à refaire en modifiant", "à refaire mais", "à refaire avec"]
  - key: retire
    label: "À ne plus refaire"
    status: probation
    definition: "Le plat sort de la rotation."
    synonyms: ["à oublier", "plus jamais", "on arrête"]

