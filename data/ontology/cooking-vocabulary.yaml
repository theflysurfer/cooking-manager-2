version: "0.4.2"
slug: cooking-vocabulary
kind: cooking
origin: >-
  Extrait du moteur de substitutions porté de cooking-manager v1
  (server/src/services/intelligentSubstitutions.ts) et mesuré en production dans
  cooking-manager-2 le 2026-09-02. Voir cooking-manager-2 ADR 0001.

# ============================================================================
# RÈGLE D'INTAKE — reprise de taste-vocabulary.yaml, même exigence
# ============================================================================
# Un concept entre en `probation`. Il ne passe `active` que s'il est REPRIS
# d'une source déjà éprouvée par l'usage, ou MESURÉ.
#
# `active` ici = le concept pilote déjà une décision en production. Les modes de
# cuisson et les cuisines sont dans ce cas : ils sont cités par les 42 règles de
# substitution qui tournent sur /api/recipes/{slug}/compatibility.
#
# `probation` = observé, pas encore mesuré. Les techniques d'accommodation y
# sont toutes : elles reposent sur UNE recette (mafe-poulet, qui prépare une part
# de crevettes pour Clémence). Une recette n'est pas un corpus.
#
# ⚠️ CE QUE CE VOCABULAIRE NE RÉSOUT PAS — et qui est passé en code le
# 2026-09-02. La détection d'un mijoté décrit sans le mot ne se règle PAS en
# ajoutant « couvrir » aux synonymes. Mesuré sur les 28 recettes du corpus :
# « milieu liquide + durée » remonte 8 faux positifs (couscous, quinoa, pommes
# de terre à l'eau bouillante). Il faut un TROISIÈME terme — l'étape doit nommer
# la protéine à remplacer. C'est `has_anchored_stew()` dans substitutions.py.
#
# ⚠️ `dominates` (v0.3.0) — UNE CUISSON PRÉPARATOIRE N'EST PAS LA CUISSON DU PLAT.
# Mesuré sur SC-68 : « faites dorer la viande », présent dans presque tout mijoté,
# déclenchait `pan-fried` avec le MÊME bonus (40) que `stew`, et faisait gagner
# *dorade* (150) sur *lotte* (135) dans une cocotte. Le rissolage est une étape,
# pas le plat. Un mode qui en `dominates` un autre le retire du contexte quand
# les deux sont détectés : ce que la cocotte absorbe ne pèse plus dans le score.
# La relation est ORIENTÉE et ne vaut qu'à l'intérieur d'une facette ; le
# générateur refuse une clé inconnue ou auto-citée.

