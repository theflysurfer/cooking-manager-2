version: "0.1.0"
slug: cooking-vocabulary
kind: cooking
origin: >-
  Extrait du moteur de substitutions porté de cooking-manager v1
  (server/src/services/intelligentSubstitutions.ts) et mesuré en production dans
  cooking-manager-2 le 2026-09-02. Voir cooking-manager-2 ADR 0001.

# ============================================================================
# RÈGLE D'INTAKE — reprise de taste-vocabulary.yaml, même exigence
# ============================================================================
# Un concept entre en `probation`. Il ne passe `active` que s'il est REPRIS
# d'une source déjà éprouvée par l'usage, ou MESURÉ.
#
# `active` ici = le concept pilote déjà une décision en production. Les modes de
# cuisson et les cuisines sont dans ce cas : ils sont cités par les 42 règles de
# substitution qui tournent sur /api/recipes/{slug}/compatibility.
#
# `probation` = observé, pas encore mesuré. Les techniques d'accommodation y
# sont toutes : elles reposent sur UNE recette (mafe-poulet, qui prépare une part
# de crevettes pour Clémence). Une recette n'est pas un corpus.
#
# ⚠️ CE QUE CE VOCABULAIRE NE RÉSOUT PAS. La détection d'un mijoté décrit sans
# le mot — « Poser le poulet sur les légumes, couvrir. Cuire 12-15 min » — ne se
# règle PAS en ajoutant « couvrir » aux synonymes : presque toute recette
# contient un « couvrir » quelque part, et le terme sur-déclencherait. Il faut
# une détection ancrée sur les étapes qui nomment l'ingrédient, plus une
# conjonction (couvrir ET durée). C'est du code, pas du vocabulaire.

cooking_methods:
  - key: stew
    label: "Mijoté"
    status: active
    definition: "Cuisson longue en milieu liquide, à couvert ou à feu doux."
    synonyms: ["mijoté", "ragoût", "cocotte", "braisé", "à feu doux", "à petit feu", "à couvert"]
  - key: slow-cooked
    label: "Cuisson lente"
    status: active
    definition: "Cuisson prolongée à basse température."
    synonyms: ["mijoté", "slow-cooked", "cuisson lente"]
  - key: grilled
    label: "Grillé"
    status: active
    definition: "Cuisson par contact direct avec une source de chaleur vive."
    synonyms: ["grillé", "barbecue", "plancha", "grill"]
  - key: bbq
    label: "Barbecue"
    status: active
    definition: "Grillade au feu de bois ou au charbon."
    synonyms: ["barbecue", "bbq"]
  - key: pan-fried
    label: "Poêlé"
    status: active
    definition: "Cuisson à la poêle avec un corps gras."
    synonyms: ["poêlé", "sauté", "à la poêle", "dans une poêle", "dans la poêle", "faites dorer"]
  - key: pan-seared
    label: "Saisi"
    status: active
    definition: "Saisie vive et courte, cœur peu cuit."
    synonyms: ["saisir", "snacké", "poêler"]
  - key: stir-fry
    label: "Sauté au wok"
    status: active
    definition: "Sauté vif et remué, à feu très fort."
    synonyms: ["wok", "sauté", "stir-fry"]
  - key: oven
    label: "Au four"
    status: active
    definition: "Cuisson au four, chaleur enveloppante."
    synonyms: ["au four", "rôti"]
  - key: breaded
    label: "Pané"
    status: active
    definition: "Enrobé de chapelure avant cuisson."
    synonyms: ["pané", "chapelure", "panko", "katsu", "tempura"]
  - key: steamed
    label: "Vapeur"
    status: active
    definition: "Cuisson à la vapeur, sans contact avec le liquide."
    synonyms: ["vapeur", "cuit à la vapeur"]
  - key: glazed
    label: "Laqué"
    status: active
    definition: "Nappé d'une sauce réduite et sucrée en fin de cuisson."
    synonyms: ["laqué", "glacé"]
  - key: smoked
    label: "Fumé"
    status: active
    definition: "Aromatisé et conservé par la fumée."
    synonyms: ["fumé", "au fumoir"]
  - key: raw
    label: "Cru"
    status: active
    definition: "Servi sans cuisson, éventuellement mariné."
    synonyms: ["tartare", "carpaccio", "cru", "mariné"]

