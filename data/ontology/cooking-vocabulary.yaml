  - key: texture
    label: "Texture"
    status: probation
    definition: "Consistance ratée indépendamment de la cuisson : pâteux, sec, filandreux, détrempé."
    synonyms: ["pâteux", "sec", "filandreux", "détrempé", "spongieux"]
  - key: doneness
    label: "Cuisson"
    status: probation
    definition: "Trop cuit ou pas assez."
    synonyms: ["trop cuit", "pas assez cuit", "cramé", "cru", "brûlé"]
  - key: portion
    label: "Quantité"
    status: probation
    definition: "Trop ou pas assez servi — vise le calcul de portions, pas le goût."
    synonyms: ["trop peu", "pas assez", "il en restait", "on a eu faim"]
  - key: effort
    label: "Effort disproportionné"
    status: probation
    definition: "Le temps ou la charge de préparation ne valait pas le résultat."
    applicable_when: "Jugé par celui qui cuisine, pas par la tablée."
    synonyms: ["trop long", "trop de vaisselle", "pas rentable", "prise de tête"]
