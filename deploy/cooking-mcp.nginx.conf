server {
    listen 80;
    listen [::]:80;
    server_name cooking-mcp.srv759970.hstgr.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cooking-mcp.srv759970.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/cooking-mcp.srv759970.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cooking-mcp.srv759970.hstgr.cloud/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3868;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
