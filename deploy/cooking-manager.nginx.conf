server {
    listen 80;
    server_name cooking.srv759970.hstgr.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cooking.srv759970.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/cooking.srv759970.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cooking.srv759970.hstgr.cloud/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8795;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8795;
    }

    location / {
        root /opt/cooking-manager-2/web;
        try_files $uri $uri/ /index.html;
    }
}
