[project]
name = "cooking-manager"
version = "2.0.0"
description = "Build cuisine.json from Obsidian vault recipes and menus"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[tool.ruff]
select = ["F", "B"]
target-version = "py310"

[tool.pyright]
reportCallIssue = "error"
