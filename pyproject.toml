[project]
name = "cooking-manager"
version = "2.0.0"
description = "Cooking Manager — browse and filter family recipes from Obsidian vault"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
]

[tool.setuptools.packages.find]
include = ["cooking_manager*", "backend*"]

[project.scripts]
cooking-manager = "cooking_manager.__main__:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B"]

[tool.pyright]
reportCallIssue = "error"
